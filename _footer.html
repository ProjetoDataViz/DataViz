<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodapé de Endereço</title>
    <style>
        /* Estilos gerais da página */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* A página agora tem fundo branco (padrão) */
        }

        /* O conteúdo do seu site (projetos em Quarto/Shiny, etc) entraria aqui, 
           antes do rodapé */

        /* Container principal do endereço */
        .endereco-container {
            background-color: #0a012a; /* Cor de fundo movida para cá */
            color: #ffffff; /* Cor do texto movida para cá */
            padding: 60px 40px 40px 20%;
        }

        /* Estilo do título "Endereço" */
        .endereco-container h2 {
            color: #3b71e8; 
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 12px;
            margin-top: 0;
        }

        /* Estilo das linhas de endereço */
        .endereco-container p {
            margin: 8px 0;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Barra inferior dos direitos autorais */
        .copyright-bar {
            background-color: #06001a; 
            color: #ffffff; /* Garantindo que o texto aqui também seja branco */
            padding: 25px 20%;
            font-size: 0.85rem;
        }
        
        .copyright-bar p {
            margin: 0;
        }
    </style>
</head>
<body>

    <div style="min-height: 200px; padding: 20px;">
        </div>

    <div class="endereco-container">
        <h2>Endereço</h2>
        <p>Rua Prof. Marcos Waldemar de Freitas Reis s/n</p>
        <p>Instituto de Matemática e Estatística – Bloco H – 5o. andar – Ala A</p>
        <p>São Domingos, Niterói – RJ, CEP 24.210-201</p>
    </div>

    <div class="copyright-bar">
        <p>© Copyright 2026. UFF - Todos os direitos reservados.</p>
    </div>

</body>
</html>
